name: "Bug"
description: "Something in VA_center_opt / calibration / replayer behaves wrongly"
title: "[REQ-____] <component>: <short symptom>"
labels: ["type:bug", "needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        > **This repository is PUBLIC.** Participant **codes only** (s01, K03, A02 ...). Never paste names,
        > birthdays, case-record contents, photos or screenshots showing a face, or raw data files.
        > Field data stays on the NAS; refer to it by dataset / session folder name.
  - type: input
    id: req
    attributes:
      label: Tracker REQ ID
      description: "Row ID in the NTUH tracker (REQ-0001 ...). Write 'internal' if it did not come from the tracker."
      placeholder: "REQ-0000"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: "How Bouing will work on it. Edan confirms at triage and sets the matching label."
      options:
        - "mode:manual-check - reproduce / verify by hand"
        - "mode:claude-dev - implement with Claude Code (then also fill the Claude-dev template)"
        - "Edan handles it (not assigned to Bouing)"
        - "Not decided (triage)"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: ["VA test", "Accuracy test / Sol calibration", "VF test", "calibration", "replayer", "packaging / release", "other"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Found in (release zip date + app version from the window title)
      placeholder: "20260827 zip, VA_center_opt v1.5.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what was expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (screen setup, DPI scaling, single/dual monitor, Sol connected?)
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (codes only)
      description: "Console output from run_debug.bat, output file names, JSON fields (e.g. accuracy_report.json meta), NAS location as <dataset>/<session folder>."
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (how NTUH / Edan will verify the fix)
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P0 blocks data collection / corrupts data", "P1 before next collection", "P2 normal", "P3 nice to have"]
    validations:
      required: true
