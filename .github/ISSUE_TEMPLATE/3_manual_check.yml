name: "Manual check (software)"
description: "A hands-on check of the software: reproduce a bug, verify a fix or a release build on real hardware"
title: "[REQ-____] <component>: check <what>"
labels: ["mode:manual-check", "needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        > **This repository is PUBLIC.** Participant **codes only** (s01, K03, A02 ...). Never paste names,
        > birthdays, case-record contents, photos or screenshots showing a face, or raw data files.
        >
        > Checks of **collected data** (folder counts, calib_model_loaded, missing files ...) are data QC and go to
        > the private QC repository, not here.
  - type: input
    id: req
    attributes:
      label: Tracker REQ ID
      description: "REQ-xxxx from the NTUH tracker, or 'internal'."
      placeholder: "REQ-0000"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: ["VA test", "Accuracy test / Sol calibration", "VF test", "calibration", "replayer", "packaging / release", "other"]
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build / commit under test
      placeholder: "20260827 zip (VA_center_opt v1.5.0) or develop @ <sha>"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      value: |
        - Screens (resolution, DPI scaling, single/dual):
        - Sol glasses connected: yes / no
        - Webcam: yes / no
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result (fill in when done; codes only)
      description: "What you observed, with console output / screenshots without faces. Open a Bug issue for anything that fails."
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] Result filled in and reviewed by Edan
        - [ ] Follow-up issues opened (linked here)
