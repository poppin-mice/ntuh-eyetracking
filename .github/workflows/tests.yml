# Hardware-free unit tests (tests/, settings in pytest.ini).
# Installs only what the tests import: numpy + OpenCV at the versions pinned in
# requirements.txt, plus pytest and pyflakes from requirements-dev.txt. The app stack (Sol SDK,
# MediaPipe, MNN, pygame, PyQt6, PyInstaller) is NOT installed here; release builds
# stay local (see CLAUDE.md, "Versioning & release flow").
name: tests

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies only
        shell: bash
        run: |
          # tr: the Windows runner may check files out with CRLF line endings.
          PINS=$(tr -d '\r' < requirements.txt | grep -E '^(numpy|opencv-contrib-python)==' | sed 's/[[:space:]]*#.*$//')
          echo "Pins taken from requirements.txt:"; echo "$PINS"
          test "$(echo "$PINS" | wc -l)" -eq 2
          python -m pip install --upgrade pip
          python -m pip install $PINS -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -p no:cacheprovider

      # Does not fail the job yet: the 3 known hits (in_transition in
      # ntuh/sol/offset_calibration.py) go away when the 3D Sol calibration is retired
      # (REQ-0034). Remove continue-on-error then, so a new undefined name blocks the PR.
      - name: Undefined names in ntuh/ (pyflakes, non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          python -m pyflakes ntuh > pyflakes.txt || true
          if grep "undefined name" pyflakes.txt; then exit 1; fi
          echo "No undefined names in ntuh/."
